<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salina Tarot — CyberGirlfriends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a12;
    --deep:#10182b;
    --deep2:#161f36;
    --burgundy:#5c1a2e;
    --burgundy-bright:#8a2740;
    --gold:#c9a868;
    --gold-bright:#e8c783;
    --pearl:#f3ecdd;
    --muted:#9089a0;
    --line: rgba(201,168,104,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(138,39,64,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 100%, rgba(201,168,104,0.10), transparent 60%),
      var(--void);
    color:var(--pearl);
    font-family:'Noto Sans Thai','Cormorant Garamond',serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .disp{font-family:'Noto Serif Thai','Playfair Display',serif;}
  ::selection{background:var(--gold); color:var(--void);}
  #app{max-width:720px;margin:0 auto;padding:28px 20px 80px;position:relative;min-height:100vh;}

  /* ambient stars */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .stars span{position:absolute;width:2px;height:2px;background:var(--gold-bright);border-radius:50%;opacity:.35;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.65;}}

  .topbar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-bottom:8px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .k1{font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;}
  .brand .k2{font-family:'Playfair Display',serif;font-size:17px;letter-spacing:.12em;color:var(--gold-bright);}
  .langtoggle{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px;}
  .langtoggle button{border:none;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;letter-spacing:.04em;}
  .langtoggle button.active{background:var(--gold);color:var(--void);font-weight:600;}

  .hairline{height:1px;background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);opacity:.5;margin:22px 0;}

  /* HOME */
  .home{text-align:center;padding-top:6vh;position:relative;z-index:2;}
  .home .eyebrow{font-size:12px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-bottom:22px;animation:fadeUp .6s ease;}
  .home h1{font-family:'Playfair Display',serif;font-size:40px;letter-spacing:.06em;color:var(--gold-bright);margin:0;text-shadow:0 0 40px rgba(232,199,131,0.25);animation:fadeUp .8s ease .05s backwards;}
  .home h2.disp{font-size:20px;font-weight:500;color:var(--pearl);margin:6px 0 22px;letter-spacing:.1em;animation:fadeUp .8s ease .1s backwards;}
  .home .tagline{font-size:18px;color:var(--muted);line-height:1.85;margin-bottom:38px;font-style:italic;animation:fadeUp .8s ease .15s backwards;}
  .home .ctaWrap{animation:fadeUp .8s ease .2s backwards;}
  .sigil{width:64px;height:64px;margin:0 auto 30px;opacity:.85;}

  /* SALINA PORTRAIT */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .portraitWrap{
    position:relative;width:216px;margin:0 auto 26px;
    animation:fadeUp .8s cubic-bezier(.2,.7,.2,1);
  }
  .portraitGlow{
    position:absolute;inset:-30px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,199,131,0.28), rgba(138,39,64,0.16) 55%, transparent 75%);
    filter:blur(6px);z-index:0;
  }
  .portraitFrame{
    position:relative;z-index:1;border-radius:50%;overflow:visible;
    animation:floatY 6s ease-in-out infinite;
  }
  .portraitFrame svg{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));}

  .salinaAvatar.big{width:84px;height:84px;}
  .salinaAvatar.big svg{width:100%;height:100%;}

  .goldbtn{
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, #b8935a);
    color:var(--void);font-weight:600;letter-spacing:.03em;
    border:none;border-radius:3px;padding:16px 34px;font-size:16px;cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif;
    box-shadow:0 8px 28px rgba(201,168,104,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    transition:transform .25s cubic-bezier(.2,.8,.3,1), box-shadow .25s ease;
    position:relative;
  }
  .goldbtn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(201,168,104,0.4), inset 0 1px 0 rgba(255,255,255,0.4);}
  .goldbtn:active{transform:translateY(0);}
  .goldbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .ghostbtn{
    background:transparent;border:1px solid var(--line);color:var(--pearl);
    border-radius:2px;padding:13px 26px;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .ghostbtn:hover{border-color:var(--gold);color:var(--gold-bright);}

  .footlink{margin-top:26px;}
  .footlink button{background:none;border:none;color:var(--muted);font-size:13px;letter-spacing:.05em;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-family:inherit;}
  .footlink button:hover{color:var(--gold-bright);}

  /* QUESTION SCREEN */
  .panel{position:relative;z-index:2;}
  .stepLabel{font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  .qTitle{font-family:'Playfair Display',serif;font-size:26px;color:var(--pearl);margin:0 0 26px;}
  textarea.qInput{
    width:100%;min-height:100px;background:rgba(255,255,255,0.03);
    border:1px solid var(--line);border-radius:2px;color:var(--pearl);
    padding:16px;font-size:18px;font-family:'Cormorant Garamond',serif;line-height:1.5;resize:vertical;
  }
  textarea.qInput:focus{outline:none;border-color:var(--gold);}
  .chipRow{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 34px;}
  .chip{border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:14px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;}
  .chip.active{border-color:var(--gold);color:var(--gold-bright);background:rgba(201,168,104,0.08);}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}

  /* SHUFFLE / SELECT */
  .selectHead{text-align:center;margin-bottom:6px;}
  .positionHint{font-size:15px;color:var(--muted);margin-bottom:22px;text-align:center;line-height:1.7;}
  .posBadges{display:flex;justify-content:center;gap:10px;margin-bottom:26px;}
  .posBadge{border:1px solid var(--line);border-radius:2px;padding:8px 14px;font-size:12px;letter-spacing:.05em;color:var(--muted);text-align:center;min-width:88px;}
  .posBadge.done{border-color:var(--gold);color:var(--gold-bright);background:rgba(201,168,104,0.06);}
  .posBadge .n{display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;margin-bottom:3px;}

  .deckWrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,0.015);}
  .cardBack{
    width:34px;height:52px;border-radius:3px;cursor:pointer;position:relative;flex-shrink:0;
    background:
      repeating-linear-gradient(45deg, rgba(201,168,104,0.15) 0 2px, transparent 2px 6px),
      linear-gradient(160deg, var(--deep2), var(--burgundy) 130%);
    border:1px solid var(--gold);
    transition:transform .15s ease, box-shadow .15s ease, opacity .3s ease;
  }
  .cardBack::after{
    content:"";position:absolute;inset:4px;border:1px solid rgba(201,168,104,0.5);border-radius:2px;
  }
  .cardBack:hover:not(.taken){transform:translateY(-5px);box-shadow:0 8px 18px rgba(0,0,0,0.5);}
  .cardBack.taken{opacity:0;pointer-events:none;transform:scale(.4);}

  .traySpace{display:flex;gap:14px;justify-content:center;margin:30px 0;min-height:170px;}
  .traySlot{width:100px;display:flex;flex-direction:column;align-items:center;}
  .traySlot .label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;text-align:center;text-transform:uppercase;}
  .cardFront{
    width:100px;height:158px;border-radius:5px;border:1px solid var(--gold);
    background:linear-gradient(165deg, #1a2340, #0d1220 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:10px 6px;position:relative;
    box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 0 0 1px rgba(201,168,104,0.15);
  }
  .cardFront .num{font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);letter-spacing:.1em;}
  .cardFront .icon{width:34px;height:34px;opacity:.9;}
  .cardFront .fname{font-family:'Playfair Display',serif;font-size:12.5px;text-align:center;color:var(--pearl);line-height:1.25;}
  .cardFront .orient{font-size:9px;letter-spacing:.15em;color:var(--gold-bright);text-transform:uppercase;}
  .cardFront.reversed{transform:rotate(180deg);}
  .cardFront.reversed .orient{transform:rotate(180deg);}
  .cardFront.empty{border-style:dashed;border-color:var(--line);background:transparent;box-shadow:none;}

  .cardFlipIn{animation:flipIn .55s cubic-bezier(.2,.7,.3,1);}
  @keyframes flipIn{from{transform:rotateY(90deg) scale(.8);opacity:0;}to{transform:rotateY(0) scale(1);opacity:1;}}

  /* seal */
  .sealWrap{position:relative;text-align:center;margin:26px 0 10px;}
  .sealRibbon{
    width:74px;height:74px;margin:0 auto;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, #8a6a2e 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    animation:sealDrop .6s cubic-bezier(.2,.8,.3,1);
    position:relative;
  }
  .sealRibbon svg{width:40px;height:40px;}
  @keyframes sealDrop{0%{transform:translateY(-40px) scale(.4) rotate(-25deg);opacity:0;}100%{transform:translateY(0) scale(1) rotate(0);opacity:1;}}
  .sealText{font-size:12px;letter-spacing:.2em;color:var(--gold-bright);text-transform:uppercase;margin-top:12px;}
  .sealSub{font-size:14px;color:var(--muted);margin-top:4px;}

  /* REVEAL / LOCKED */
  .lockedGrid{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 20px;}
  .lockedCol{display:flex;flex-direction:column;align-items:center;width:150px;}
  .lockedCol .plabel{font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;text-align:center;}
  .lockedCol .cardFront{width:150px;height:236px;}
  .lockedCol .cardFront .fname{font-size:16px;}
  .lockedCol .cardFront .icon{width:52px;height:52px;}
  .lockedCol .cardFront .num{font-size:14px;}
  .lockedCol .orientLabel{margin-top:10px;font-size:13px;color:var(--muted);text-align:center;}
  .lockedCol .orientLabel b{color:var(--gold-bright);display:block;font-size:14px;}

  /* SALINA */
  .salinaHead{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .salinaAvatar{width:64px;height:64px;border-radius:50%;flex-shrink:0;overflow:hidden;border:1px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .salinaAvatar svg{width:100%;height:100%;display:block;}
  .salinaName{font-family:'Playfair Display',serif;font-size:21px;color:var(--gold-bright);letter-spacing:.02em;}
  .salinaSub{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px;}

  .readingBody{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.85;color:var(--pearl);}
  .readingBody h2{font-family:'Playfair Display',serif;font-size:19px;color:var(--gold-bright);border-bottom:1px solid var(--line);padding-bottom:8px;margin:30px 0 12px;letter-spacing:.02em;}
  .readingBody h2:first-child{margin-top:0;}
  .readingBody p{margin:0 0 14px;}
  .readingBody strong{color:var(--gold-bright);}

  .loadingWrap{text-align:center;padding:60px 0;}
  .loadingWrap .sigilspin{width:52px;height:52px;margin:0 auto 20px;animation:spin 3.2s linear infinite;opacity:.8;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loadingWrap p{color:var(--muted);font-style:italic;font-size:16px;}

  .errBox{border:1px solid var(--burgundy-bright);background:rgba(138,39,64,0.12);color:var(--pearl);padding:16px 18px;border-radius:3px;font-size:14px;line-height:1.6;}

  /* HISTORY */
  .histItem{border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
  .histItem:hover{border-color:var(--gold);}
  .histItem .hq{font-family:'Playfair Display',serif;font-size:15px;color:var(--pearl);margin-bottom:6px;}
  .histItem .hmeta{font-size:12px;color:var(--muted);letter-spacing:.05em;}
  .emptyState{text-align:center;padding:50px 20px;color:var(--muted);font-style:italic;}

  @media (max-width:480px){
    .home h1{font-size:34px;}
    .lockedCol{width:44%;}
    .lockedCol .cardFront{width:100%;height:190px;}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div id="app"></div>

<script>
/* ============== DECK ENGINE ============== */
const MAJOR_TH = [
  ["0","เดอะ ฟูล","จุดเริ่มต้น อิสระ ความเสี่ยงที่ไร้เดียงสา","ความประมาท การก้าวไม่คิดหน้าคิดหลัง"],
  ["I","เดอะ เมจิเชียน","พลังสร้างสรรค์ ความสามารถ การลงมือทำ","การหลอกลวง พลังที่ยังไม่ถูกใช้"],
  ["II","มหาปุโรหิตินี","สัญชาตญาณ ความลับ ปัญญาภายใน","ความลับที่ถูกปิดบัง การขาดการเชื่อมโยงกับใจตน"],
  ["III","จักรพรรดินี","ความอุดมสมบูรณ์ ความรัก การเติบโต","ความไม่มั่นคง การพึ่งพาเกินไป"],
  ["IV","จักรพรรดิ","โครงสร้าง อำนาจ ความมั่นคง","ความเข้มงวดเกินไป การควบคุมที่มากเกินไป"],
  ["V","พระสันตะปาปา","ประเพณี คำแนะนำ ความเชื่อ","การต่อต้านกฎเกณฑ์ หลักคำสอนที่คับแคบ"],
  ["VI","คู่รัก","การเลือก ความสัมพันธ์ ความปรารถนา","ความลังเล ความไม่ลงรอย"],
  ["VII","ราชรถ","ความมุ่งมั่น ชัยชนะ การควบคุมทิศทาง","การเสียการควบคุม ทิศทางที่สับสน"],
  ["VIII","ความยุติธรรม","ความจริง ความสมดุล ผลลัพธ์ที่เป็นธรรม","ความอยุติธรรม การตัดสินที่ลำเอียง"],
  ["IX","ฤๅษี","การใคร่ครวญ ปัญญา การถอยเพื่อทบทวน","ความโดดเดี่ยว การหลีกหนีความจริง"],
  ["X","กงล้อแห่งโชคชะตา","การเปลี่ยนแปลง วัฏจักร โชคชะตา","ความโชคร้ายชั่วคราว การหมุนที่ควบคุมไม่ได้"],
  ["XI","พลัง","ความกล้าหาญ การควบคุมด้วยใจอ่อนโยน","ความอ่อนแอ การขาดความเชื่อมั่น"],
  ["XII","แขวนกลับหัว","การหยุดนิ่ง มุมมองใหม่ การเสียสละ","การติดอยู่กับที่ ความล่าช้าโดยไม่จำเป็น"],
  ["XIII","อาร์คานาไร้ชื่อ","การสิ้นสุด การเปลี่ยนผ่าน การปล่อยวาง","การต่อต้านความเปลี่ยนแปลง ความกลัวการสูญเสีย"],
  ["XIV","ความพอประมาณ","ความสมดุล การผสานสิ่งตรงข้าม ความอดทน","ความสุดโต่ง การขาดสมดุล"],
  ["XV","ปีศาจ","ความผูกมัด ตัณหา เงาในใจ","การปลดปล่อยจากพันธนาการ การเผชิญหน้ากับเงา"],
  ["XVI","หอคอย","การพังทลายฉับพลัน ความจริงที่เปิดเผย","ความเปลี่ยนแปลงที่ถูกเลี่ยง วิกฤตที่รอวันมาถึง"],
  ["XVII","ดารา","ความหวัง แรงบันดาลใจ การเยียวยา","ความสิ้นหวังชั่วคราว การขาดศรัทธาในตนเอง"],
  ["XVIII","จันทรา","ความคลุมเครือ จิตใต้สำนึก ความกลัวที่ซ่อนอยู่","ความสับสนที่คลี่คลาย การมองเห็นความจริง"],
  ["XIX","สุริยัน","ความสำเร็จ ความสุข ความชัดเจน","ความสุขที่ล่าช้า ความมั่นใจที่มากเกินไป"],
  ["XX","การตัดสิน","การตื่นรู้ การให้อภัย จุดเปลี่ยนสำคัญ","การลังเลที่จะเปลี่ยนแปลง การตัดสินตนเองรุนแรง"],
  ["XXI","โลก","ความสำเร็จสมบูรณ์ การบรรลุเป้าหมาย","งานที่ยังไม่จบ ความสำเร็จที่ไม่สมบูรณ์"]
];
const MAJOR_FR = ["Le Mat","Le Bateleur","La Papesse","L'Impératrice","L'Empereur","Le Pape","L'Amoureux","Le Chariot","La Justice","L'Hermite","La Roue de Fortune","La Force","Le Pendu","Arcane sans nom","Tempérance","Le Diable","La Maison Dieu","L'Étoile","La Lune","Le Soleil","Le Jugement","Le Monde"];

const SUITS = [
  {key:"batons", fr:"Bâtons", th:"ไม้เท้า", element:"ไฟ", theme:"ความกล้า การกระทำ ความหลงใหล ไฟแห่งความมุ่งมั่น"},
  {key:"coupes", fr:"Coupes", th:"ถ้วย", element:"น้ำ", theme:"ความรู้สึก ความรัก จิตใจ และความสัมพันธ์"},
  {key:"epees", fr:"Épées", th:"ดาบ", element:"ลม", theme:"ความคิด ความขัดแย้ง สติปัญญา และความจริง"},
  {key:"deniers", fr:"Deniers", th:"เหรียญ", element:"ดิน", theme:"เงินทอง ร่างกาย และความมั่นคงทางวัตถุ"}
];
const RANKS = [
  {n:"1", fr:"As", th:"เอซ", th_full:"เอซ", theme:"จุดเริ่มต้นของพลังบริสุทธิ์"},
  {n:"2", fr:"2", th:"2", theme:"ความสมดุลและการเลือก"},
  {n:"3", fr:"3", th:"3", theme:"การเติบโตและความร่วมมือ"},
  {n:"4", fr:"4", th:"4", theme:"ความมั่นคงที่ก่อร่างขึ้น"},

function buildDeck(){
  const deck = [];
  MAJOR_TH.forEach((m,i)=>{
    deck.push({
      id:"M"+i, arcana:"major", suit:"none",
      number:m[0], nameFr:MAJOR_FR[i], nameTh:m[1],
      keywords:m[2],
      upright:m[2], reversed:m[3]
    });
  });
  SUITS.forEach(s=>{
    RANKS.forEach(r=>{
      const fname = (r.fr==="As" ? "As de "+s.fr : r.fr+" de "+s.fr);
      const tname = (r.th_full ? r.th_full : r.th)+"แห่ง"+s.th;
      deck.push({
        id:"m_"+s.key+"_"+r.n, arcana:"minor", suit:s.key,
        number:r.n, nameFr:fname, nameTh:tname,
        keywords:s.theme+" • "+r.theme,
        upright:r.theme+" ผ่านพลังของธาตุ"+s.element,
        reversed:"พลังของ"+s.th+"ที่ติดขัดหรือกลับด้าน — "+r.theme+"ที่ยังไม่คลี่คลาย"
      });
    });
    COURTS.forEach(c=>{
      deck.push({
        id:"m_"+s.key+"_"+c.fr, arcana:"minor", suit:s.key,
        number:"court", nameFr:c.fr+" de "+s.fr, nameTh:c.th+"แห่ง"+s.th,
        keywords:s.theme+" • "+c.theme,
        upright:c.theme+" แสดงออกผ่านธาตุ"+s.element,
        reversed:c.theme+"ที่ถูกบิดเบือนหรือใช้ในทางที่ไม่สมดุล"
      });
    });
  });
  return deck;
}
const FULL_DECK = buildDeck();
console.assert(FULL_DECK.length===78, "Deck must have 78 cards");

function cryptoShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const r = new Uint32Array(1); crypto.getRandomValues(r);
    const j = r[0] % (i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randomOrientation(){
  const r = new Uint32Array(1); crypto.getRandomValues(r);
  return (r[0]%2===0) ? "upright" : "reversed";
}

    {label:t('pos1t')}, {label:t('pos2t')}, {label:t('pos3t')}
  ];
  const cols = state.picks.map((p,i)=>`
    <div class="lockedCol">
      <div class="plabel">${positions[i].label}</div>
      ${cardFrontHtml(p.card, p.orientation)}
      <div class="orientLabel"><b>${p.orientation==='reversed'?t('reversed'):t('upright')}</b></div>
    </div>`).join('');
  return `
  <div class="panel" style="text-align:center;">
    <div class="sealRibbon" style="animation:none;"><svg viewBox="0 0 40 40" fill="none" stroke="var(--void)" stroke-width="2"><path d="M20 6 L22 17 L33 20 L22 23 L20 34 L18 23 L7 20 L18 17 Z"/></svg></div>
    <h2 class="disp" style="font-size:22px;color:var(--gold-bright);margin:16px 0 6px;">${t('lockedTitle')}</h2>
    <p style="color:var(--muted);font-size:14px;max-width:440px;margin:0 auto 30px;">${t('lockedSub')}</p>
    <div class="lockedGrid">${cols}</div>
    <div class="hairline" style="max-width:300px;margin:26px auto;"></div>
    <button class="goldbtn" id="btn-ask-salina">${t('askSalina')}</button>
    <div class="footlink"><button id="btn-reset">${t('newReading')}</button></div>
  </div>`;
}
function readingScreen(){
  if(state.loading){
    return `<div class="panel">
      <div class="loadingWrap">
        <div class="sigilspin">${sigilSvg()}</div>
        <p>${t('salinaThinking')}</p>
      </div>
    </div>`;
  }
  if(state.error){
    return `<div class="panel">
      <div class="errBox">${t('errTitle')}<br><span style="color:var(--muted);font-size:12px;">${escapeHtml(state.error)}</span></div>
      <div style="margin-top:20px;display:flex;gap:12px;">
        <button class="goldbtn" id="btn-retry-salina">${t('retry')}</button>
        <button class="ghostbtn" id="btn-reset">${t('newReading')}</button>
      </div>
    </div>`;
  }
  return `<div class="panel">
    <div class="salinaHead">
      <div class="salinaAvatar">${salinaFaceSvg()}</div>
      <div><div class="salinaName">Madame Salina</div><div class="salinaSub">${t('salinaSub')}</div></div>
    </div>
    <div class="readingBody">${state.reading || ''}</div>
    <div class="hairline"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="goldbtn" id="btn-reset">${t('newReading')}</button>
      <button class="ghostbtn" id="btn-history">${t('history')}</button>
    </div>
  </div>`;
}
function historyScreen(){
  if(!state.history.length){
    return `<div class="panel">
      <div class="stepLabel">${t('history')}</div>
      <div class="emptyState">${t('histEmpty')}</div>
      <button class="ghostbtn" id="btn-back-home">${t('histBack')}</button>
    </div>`;
  }
  const items = state.history.map((h,i)=>`
    <div class="histItem" data-histidx="${i}">
      <div class="hq">${escapeHtml(h.question)}</div>
      <div class="hmeta">${new Date(h.createdAt).toLocaleDateString()} · ${h.cards.map(c=>state.lang==='fr'?c.card.nameFr:c.card.nameTh).join(' · ')}</div>
    </div>`).join('');
  return `<div class="panel">
    <div class="stepLabel">${t('history')}</div>
    ${items}
    <button class="ghostbtn" id="btn-back-home" style="margin-top:10px;">${t('histBack')}</button>
  </div>`;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============== HANDLERS ============== */
function attachHandlers(){
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang; render();});
  const s1=document.getElementById('btn-start'); if(s1) s1.onclick=()=>{state.screen='question'; render();};
  const hh=document.getElementById('btn-history'); if(hh) hh.onclick=()=>{state.screen='history'; render();};
  const bh=document.getElementById('btn-back-home'); if(bh) bh.onclick=()=>{state.screen='home'; render();};

  const qi=document.getElementById('qInput');
  if(qi) qi.oninput=()=>{ state.question=qi.value; document.getElementById('btn-to-select').disabled = state.question.trim().length<2; };
  document.querySelectorAll('[data-cat]').forEach(c=>c.onclick=()=>{state.category=c.dataset.cat; render();});
  const bqh=document.getElementById('btn-back-home'); if(bqh) bqh.onclick=()=>{state.screen='home'; render();};
  const bts=document.getElementById('btn-to-select'); if(bts) bts.onclick=()=>{
    state.deck = cryptoShuffle(FULL_DECK);
    state.picks = [];
    state.screen='select'; render();
  };

  document.querySelectorAll('.cardBack:not(.taken)').forEach(cb=>{
    cb.onclick=()=>{
      if(state.picks.length>=3) return;
      const card = state.deck.find(c=>c.id===cb.dataset.cardid);
      const orientation = randomOrientation();
      state.picks.push({card, orientation});
      render();
      if(state.picks.length===3){
        setTimeout(()=>{ state.screen='locked'; render(); }, 900);
      }
    };
  });

  const bas=document.getElementById('btn-ask-salina'); if(bas) bas.onclick=()=>{ state.screen='reading'; state.loading=true; state.error=null; render(); askSalina(); };
  const brs=document.getElementById('btn-retry-salina'); if(brs) brs.onclick=()=>{ state.loading=true; state.error=null; render(); askSalina(); };
  const brt=document.getElementById('btn-reset'); if(brt) brt.onclick=()=>{
    state.question=''; state.picks=[]; state.deck=[]; state.reading=null; state.error=null; state.screen='home'; render();
  };
  document.querySelectorAll('[data-histidx]').forEach(h=>h.onclick=()=>{
    const entry = state.history[Number(h.dataset.histidx)];
    state.question = entry.question;
    state.picks = entry.cards;
    state.reading = entry.readingHtml;
    state.loading=false; state.error=null;
    state.screen='reading'; render();
  });
}

/* ============== SALINA AI CALL ============== */
async function askSalina(){
  const positions = [
    {key:'situation', th:'สถานการณ์ปัจจุบัน', fr:'Situation actuelle'},
    {key:'hiddenInfluence', th:'สิ่งที่ซ่อนอยู่', fr:'Influence cachée'},
    {key:'direction', th:'ทิศทาง/คำแนะนำ', fr:'Direction / Conseil'}
  ];
  const payload = {
    question: state.question,
    language: state.lang,
    category: state.category,
    cards: state.picks.map((p,i)=>({
      position: positions[i].key,
      name: p.card.nameFr,
      nameLocal: state.lang==='fr'? p.card.nameFr : p.card.nameTh,
      orientation: p.orientation,
      keywords: p.card.keywords
    }))
  };

  const langName = state.lang==='fr' ? 'French' : 'Thai';
  const system = `You are Madame Salina, an elegant, warm, intuitive interpreter of the Tarot de Marseille, speaking to one client in a private, candle-lit reading.

STRICT RULES:
- You did NOT draw, select, replace, add, remove, or reorient any card. The application already performed a real random draw; the three cards given to you in the JSON are FINAL and IMMUTABLE.
- Interpret ONLY the three supplied cards, in the position given, respecting their upright/reversed orientation exactly as given.
- Weave in the client's exact question. Never produce generic horoscope text — be specific to their situation.
- Analyze the three cards together (1→2, 2→3, 1→3, recurring themes, tension, progression), not just one by one.
- Do not claim supernatural certainty; use reflective, symbolic language. Do not invent extra cards.
- Respond ENTIRELY in ${langName}, in a natural, elegant, mystical-but-grounded voice — sophisticated, direct, compassionate, never like a generic chatbot.
- Output ONLY clean HTML fragment (no markdown, no <html>/<body> tags) using <h2> for section headers and <p> for paragraphs, suitable to inject into a div. Keep it well under 700 words total so it fits the token budget.
- Structure, using these exact section headers translated naturally into ${langName}: an opening tied to the client's question; one section per card (situation/hidden influence/direction) each naming the card, its orientation, and its meaning for the question; a section synthesizing all three cards as one story; a relevant life-area section (love/career/money) ONLY if the question or category calls for it; practical advice from Salina; and a short 2-4 sentence closing word from Salina, personalized, never a generic quote.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: system,
        messages:[{role:"user", content: JSON.stringify(payload)}]
      })
    });
    if(!response.ok){ throw new Error("HTTP "+response.status); }
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text);
    let html = textBlocks.join("\n").trim();
    html = html.replace(/^```html/i,'').replace(/```$/,'').trim();
    if(!html){ throw new Error("Empty response"); }
    state.reading = html;
    state.loading=false; state.error=null;
    render();
    saveHistoryEntry({
      createdAt: Date.now(),
      question: state.question,
      category: state.category,
      language: state.lang,
      cards: state.picks,
      readingHtml: html
    });
  }catch(e){
    state.loading=false;
    state.error = (e && e.message) ? e.message : String(e);
    render();
  }
}

/* ============== STARS ============== */
function paintStars(){
  const el = document.getElementById('stars');
  let s='';
  for(let i=0;i<38;i++){
    const x=Math.random()*100, y=Math.random()*100, d=(Math.random()*3+2).toFixed(1), delay=(Math.random()*4).toFixed(1);
    s+=`<span style="left:${x}%;top:${y}%;animation-duration:${d}s;animation-delay:${delay}s;"></span>`;
  }
  el.innerHTML = s;
}

/* ============== INIT ============== */
(async function init(){
  paintStars();
  await loadHistory();
  render();
})();
</script>
